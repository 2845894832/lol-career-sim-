<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 7：用名次代替点数</title>
<style>
  :root{--ink:#1b1b1b;--muted:#6b7280;--line:#e5e7eb;--navy:#1f3a5f;--teal:#2e8b7e;--red:#b04a4a;--bg:#fbfbfa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  main{max-width:840px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:22px;margin:0 0 6px;color:var(--navy)}
  .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
  section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  h2{font-size:16px;margin:0 0 4px;color:var(--navy)}
  .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
  .slider{display:grid;grid-template-columns:1fr 70px;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:8px 0}
  input[type=range]{width:100%}
  textarea{width:100%;font:13px/1.5 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fcfcfb;color:var(--ink)}
  label.check{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:8px 0}
  button{font:inherit;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;margin-right:8px}
  button.primary{background:var(--navy);color:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .headline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 12px}
  .cell{background:#f4f7fa;border-radius:8px;padding:10px 12px}
  .cell span{font-size:12px;color:var(--muted);display:block}
  .cell b{font-size:22px;color:var(--navy);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
  th{background:#f4f7fa;color:var(--navy);font-weight:600}
  .bar{height:10px;background:#e8edf3;border-radius:999px;overflow:hidden;margin:6px 0}
  .bar > i{display:block;height:100%;background:var(--teal)}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .err{color:var(--red)}
</style>
</head>
<body>
<main>
  <h1>原型 7：用名次代替点数</h1>
  <p class="lead">要验的问题：<b>如果玩家看到的是「第 372 名」，后半程会不会自己就有内容？</b> 榜上其他人也在爬，所以名次 = 你比别人快多少。</p>

  <section>
    <h2>你的位置</h2>
    <div class="headline">
      <div class="cell"><span>排名</span><b id="rank">—</b></div>
      <div class="cell"><span>段位</span><b id="tier">—</b></div>
      <div class="cell"><span>离第一名</span><b id="ahead">—</b></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <p class="note" id="pctNote"></p>
  </section>

  <section>
    <h2>段位表（可自定义）</h2>
    <p class="sub">这里定义的是<b>分档</b>——到多少分算哪一档，不是你的起始段位。一行一档：<code>名字,分数</code>，改完点「应用」。</p>
    <textarea id="tierText" rows="11"></textarea>
    <div class="row">
      <button class="primary" id="applyTier">应用</button>
      <button id="resetTier">恢复默认</button>
    </div>
    <label class="check">
      <input type="checkbox" id="rankRule" checked>
      最高一档按名次判（前 200 名），第二高按前 1%
    </label>
    <p class="note" id="tierNote"></p>
  </section>

  <section>
    <h2>参数</h2>
    <div class="slider"><label>起始段位</label><select id="startTier"></select><span id="startV">2800</span></div>
    <div class="slider"><label>你每周上分</label><input id="gain" type="range" min="100" max="700" step="50" value="500"><span id="gainV">500</span></div>
    <div class="slider"><label>榜上平均每周上分</label><input id="rival" type="range" min="100" max="700" step="50" value="450"><span id="rivalV">450</span></div>
    <div class="slider"><label>榜单人数</label><input id="n" type="range" min="1000" max="20000" step="1000" value="10000"><span id="nV">1 万</span></div>
    <div class="row"><button class="primary" id="run">看 1 周 / 4 周 / 1 年后</button><button id="reset">重开</button></div>
    <table id="t"></table>
    <p class="note">每次点按钮都是「从此处再往后看」：先到 1 周、再到 4 周、再到 1 年。</p>
  </section>

  <section>
    <h2>榜首长什么样</h2>
    <p class="sub">榜单刚生成时的样子（第 1 名到第 1000 名）——越往上越挤。</p>
    <table id="dist"></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let START = 2800;
const DEFAULT_TIERS = "黑铁,0\n青铜,400\n白银,800\n黄金,1200\n铂金,1600\n翡翠,2000\n钻石,2400\n大师,2800\n宗师,3000\n王者,4500";
let TIERS = [], board = [], refBoard = [], me = START;

function parseTiers(text){
  const out = [], bad = [];
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if (!line) continue;
    const m = line.split(/[,，\t]/);
    if (m.length < 2) { bad.push(line); continue; }
    const name = m[0].trim(), at = Number(m[1]);
    if (!name || !isFinite(at) || at < 0) { bad.push(line); continue; }
    out.push({ name, at });
  }
  out.sort((a,b) => a.at - b.at);
  return { tiers: out, bad };
}
function tierOf(lp, rank){
  if (!TIERS.length) return "—";
  const n = board.length;
  const top = TIERS[TIERS.length - 1].name;
  const second = TIERS.length > 1 ? TIERS[TIERS.length - 2].name : null;
  if ($("rankRule").checked){
    if (rank <= 200) return top;
    if (second && rank <= Math.max(300, Math.round(n * 0.01))) return second;
  }
  let t = TIERS[0].name;
  for (const x of TIERS) if (lp >= x.at) t = x.name;
  return t;
}
function gauss(){
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}
function makeBoard(n, rivalRate){
  const arr = [];
  for (let i = 0; i < n; i++){
    let base = 2400 + 700*gauss();
    if (Math.random() < 0.02) base += Math.random()*2500;
    arr.push({ lp: Math.max(800, Math.min(9999, Math.round(base))), rate: Math.max(50, rivalRate*(1 + 0.4*gauss())) });
  }
  arr.sort((a,b) => b.lp - a.lp);
  return arr;
}
function rankOf(lp){
  let lo = 0, hi = board.length;
  while (lo < hi){ const mid = (lo + hi) >> 1; if (board[mid].lp > lp) lo = mid + 1; else hi = mid; }
  return lo + 1;
}
function fmt(n){ return n >= 10000 ? Math.round(n/10000) + " 万" : String(n); }

function render(){
  const n = board.length, r = rankOf(me);
  $("rank").textContent = "第 " + r + " 名";
  $("tier").textContent = tierOf(me, r);
  $("ahead").textContent = (board[0] ? board[0].lp - me : 0) + " 分";
  $("bar").style.width = Math.max(1, (1 - r/n) * 100).toFixed(1) + "%";
  $("pctNote").textContent = `共 ${fmt(n)} 人，你超过了 ${((1 - r/n)*100).toFixed(2)}% 的人（分数在界面里不显示）`
    + (me > 9999 ? "　·　你已经超过游戏的 9999 封顶，真按封顶算名次就全平了" : "");
}
function drawDist(){
  const rows = [["名次", "分数", "段位"]];
  const src = refBoard.length ? refBoard : board;
  for (const r of [1, 10, 50, 200, 500, 1000]){
    if (r > src.length) continue;
    const s = src[r-1].lp;
    rows.push(["第 " + r + " 名", s, tierOf(s, r)]);
  }
  $("dist").innerHTML = rows.map((row, i) => "<tr>" + row.map(c => `<t${i?"d":"h"}>${c}</t${i?"d":"h"}>`).join("") + "</tr>").join("");
}
function fillStartTiers(){
  const sel = $("startTier");
  const keep = sel.value;
  sel.innerHTML = TIERS.slice().reverse()
    .map(t => `<option value="${t.name}">${t.name}（${t.at} 分）</option>`).join("");
  if (TIERS.some(t => t.name === keep)) sel.value = keep;
  else if (TIERS.some(t => t.name === "大师")) sel.value = "大师";
  else sel.value = TIERS[TIERS.length - 1].name;
}
function startTierAt(){
  const t = TIERS.find(x => x.name === $("startTier").value);
  return t ? t.at : 2800;
}
function startLabel(){
  $("startV").textContent = startTierAt() + " 分";
}
function reset(){
  const n = +$("n").value, rival = +$("rival").value;
  START = startTierAt();
  $("nV").textContent = fmt(n); $("rivalV").textContent = rival; $("gainV").textContent = $("gain").value;
  board = makeBoard(n, rival);
  refBoard = board.map(x => ({ lp: x.lp }));
  me = START;
  fillStartTiers(); startLabel(); drawDist(); render(); run();
}
function run(){
  const gain = +$("gain").value;
  const marks = [[1, "1 周后"], [4, "4 周后"], [26, "1 年后"]];
  let lp = me, week = 0;
  const rows = [["时点", "名次", "段位", "离最高段"]];
  for (const [target, label] of marks){
    while (week < target){
      lp = Math.round(lp + gain);
      for (const p of board) p.lp = Math.round(p.lp + p.rate);
      week++;
    }
    board.sort((a,b) => b.lp - a.lp);
    const r = rankOf(lp);
    rows.push([label, `第 ${r} 名`, tierOf(lp, r), Math.max(0, r-200) + " 名"]);
  }
  $("t").innerHTML = rows.map((row, i) => "<tr>" + row.map(c => `<t${i?"d":"h"}>${c}</t${i?"d":"h"}>`).join("") + "</tr>").join("");
  me = lp; render();
}
function applyTiers(){
  const parsed = parseTiers($("tierText").value);
  if (parsed.tiers.length < 2){
    $("tierNote").innerHTML = '<span class="err">至少要两档</span>';
    return;
  }
  TIERS = parsed.tiers;
  fillStartTiers();
  $("tierNote").textContent = `已应用 ${parsed.tiers.length} 档：` + TIERS.map(t => `${t.name}(${t.at})`).join(" · ")
    + (parsed.bad.length ? `；忽略了 ${parsed.bad.length} 行格式不对的` : "");
  startLabel(); drawDist(); render();
}
$("applyTier").onclick = applyTiers;
$("resetTier").onclick = () => { $("tierText").value = DEFAULT_TIERS; applyTiers(); };
$("rankRule").onchange = () => { startLabel(); drawDist(); render(); };
$("startTier").onchange = reset;
$("n").oninput = reset;
$("rival").oninput = reset;
$("gain").oninput = () => { $("gainV").textContent = $("gain").value; };
$("run").onclick = run;
$("reset").onclick = reset;

$("tierText").value = DEFAULT_TIERS;
TIERS = parseTiers(DEFAULT_TIERS).tiers;
fillStartTiers();
reset();
</script>
</body>
</html>
