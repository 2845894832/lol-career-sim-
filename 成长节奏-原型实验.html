<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>成长节奏实验台</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--good:#3fb950;--bad:#f85149;--warn:#d29922}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI",system-ui,sans-serif;padding:16px}
h1{font-size:16px;margin:0 0 4px}
p.sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.row{display:flex;gap:12px;align-items:flex-start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
canvas{width:100%;height:auto;display:block}
.list{width:230px;flex:none}
.item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer}
.item:hover{background:#1c2128}
.item .dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .nm{font-size:13px}
.item .meta{color:var(--muted);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px;align-items:center;margin:10px 0 0;flex-wrap:wrap}
button{background:#1f6feb;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
button.ghost{background:#21262d;border:1px solid var(--line)}
input[type=range]{width:100%}
.readout{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.legend-note{color:var(--muted);font-size:12px;margin-top:8px}
</style></head><body>
<h1>成长节奏实验台（真实引擎数据）</h1>
<p class="sub">每条曲线来自 src/core 的 reduce：6 个种子 × 240 周，策略＝均衡练最弱一维、事件选加点最多的选项。数据每 4 周一个采样点。</p>

    </div>
    <input type="range" id="sc" min="0" max="1000" value="0">
    <div class="legend-note">横轴＝周（1–240），纵轴＝四维平均值。灰线 90、虚线 99＝「快满了」与「顶满」。</div>
  </div>
</div>

0.8, 89.8], [124, 91.8, 90.7], [128, 92.7, 91.5], [132, 93.7, 92.8], [136, 94.7, 93.8], [140, 95.5, 94.8], [144, 96.6, 95.8], [148, 97.6, 96.7], [152, 98.3, 97.7], [156, 99.4, 98.7], [160, 99.9, 99.5], [164, 100, 100], [168, 100, 100], [172, 100, 100], [176, 100, 100], [180, 100, 100], [184, 81, 80], [188, 82.3, 81.3], [192, 83.3, 82.2], [196, 84.5, 83.3], [200, 85.8, 84.5], [204, 86.9, 85.7], [208, 87.6, 86.7], [212, 71.2, 70.2], [216, 72.2, 71.3], [220, 73.3, 72.2], [224, 74.8, 73.2], [228, 76, 73.8], [232, 77.5, 75.2], [236, 78.7, 76.8], [240, 79.7, 78.3]]}, {"name": "40/13 休息20", "from": 40, "step": 13, "rest": 0.2, "pts": [[4, 55.7, 45], [8, 57.4, 50], [12, 58.9, 53.5], [16, 60.3, 56.3], [20, 61.6, 58.2], [24, 62.9, 60.5], [28, 64.2, 61.8], [32, 65.4, 63.3], [36, 66.4, 64.7], [40, 67.6, 66], [44, 68.9, 67.5], [48, 70, 68.5], [52, 71.1, 70], [56, 72.4, 71.2], [60, 73.5, 72.5], [64, 74.8, 73.3], [68, 75.8, 74.8], [72, 77.2, 76.2], [76, 78.4, 77], [80, 79.2, 78.3], [84, 80.2, 79.3]]}, {"name": "40/14 休息20", "from": 40, "step": 14, "rest": 0.2, "pts": [[4, 55.7, 45], [8, 57.4, 50], [12, 58.9, 53.5], [16, 60.2, 56.2], [20, 61.6, 58.2], [24, 62.9, 60.2], [28, 64.2, 61.7], [32, 65.3, 63.3], [36, 66.3, 64.5], [40, 67.4, 66], [44, 68.7, 67.2], [48, 69.8, 68.3], [52, 70.9, 69.7], [56, 72.1, 70.8], [60, 73.1, 71.8], [64, 74.3, 73], [68, 75.3, 74.3], [72, 76.7, 75.3], [76, 78.2, 77], [80, 79.2, 78], [84, 80.4, 79.2]]}, {"name": "40/15 休息25", "from": 40, "step": 15, "rest": 0.25, "pts": [[4, 55.8, 45], [8, 57.7, 50.2], [12, 59.3, 54], [16, 60.8, 57.2], [20, 62.2, 59], [24, 63.5, 60.8], [28, 64.8, 62.8], [32, 66, 64], [36, 67.3, 65.3], [40, 68.4, 67], [44, 69.8, 68.2], [48, 71, 69.3], [52, 72.3, 71.3], [56, 73.5, 72.3], [60, 74.5, 73.8], [64, 75.8, 74.8], [68, 76.9, 76], [72, 78.4, 77.5], [76, 79.5, 78], [80, 80.3, 79.7], [84, 81.3, 80.5]]}, {"name": "40/16 休息20", "from": 40, "step": 16, "rest": 0.2, "pts": [[4, 55.6, 45], [8, 57.3, 50], [12, 58.9, 53.8], [16, 60.1, 55.8], [20, 61.4, 57.7], [24, 62.7, 60.2], [28, 63.9, 61.8], [32, 65, 62.5], [36, 66, 64], [40, 67.1, 65], [44, 68.4, 66], [48, 69.4, 67.2], [52, 70.5, 68.7], [56, 71.7, 70], [60, 72.6, 71.3], [64, 73.7, 72.5], [68, 74.7, 73.7], [72, 75.9, 74.7], [76, 76.9, 75.7], [80, 77.7, 76.7], [84, 78.9, 77.8]]}];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,L=46,R=16,T=16,B=34;
const MAXX=240, MAXY=105;
const colors=['#8b949e','#58a6ff','#79c0ff','#3fb950','#d29922','#f85149','#a371f7','#ff7b72'];
const on=new Set([0,3,5]);
const list=document.getElementById('list');
D.forEach((v,i)=>{
  const el=document.createElement('div'); el.className='item';
  el.innerHTML=`<span class="dot" style="background:${colors[i]}"></span><span class="nm">${v.name}</span><span class="meta">${v.step}</span>`;
  el.onclick=()=>{ on.has(i)?on.delete(i):on.add(i); render(); };
  list.appendChild(el);
});
const x=w=>L+(w/MAXX)*(W-L-R), y=a=>T+(1-a/MAXY)*(H-T-B);
function grid(){
  ctx.clearRect(0,0,W,H);
  ctx.font='11px system-ui'; ctx.fillStyle='#8b949e'; ctx.strokeStyle='#30363d'; ctx.lineWidth=1;
  for(let a=0;a<=100;a+=20){ ctx.beginPath(); ctx.moveTo(L,y(a)); ctx.lineTo(W-R,y(a)); ctx.stroke(); ctx.fillText(a,L-26,y(a)+4); }
  for(let w=0;w<=240;w+=30){ ctx.beginPath(); ctx.moveTo(x(w),T); ctx.lineTo(x(w),H-B); ctx.stroke(); if(w) ctx.fillText((w/30)+'年',x(w)-10,H-14); }
  ctx.setLineDash([4,4]); ctx.strokeStyle='#3fb950'; ctx.beginPath(); ctx.moveTo(L,y(99)); ctx.lineTo(W-R,y(99)); ctx.stroke();
  ctx.strokeStyle='#30363d'; ctx.beginPath(); ctx.moveTo(L,y(90)); ctx.lineTo(W-R,y(90)); ctx.stroke(); ctx.setLineDash([]);
}
let playhead=0;
function render(){
  grid();
  D.forEach((v,i)=>{
    if(!on.has(i)) return;
    ctx.strokeStyle=colors[i]; ctx.lineWidth=2; ctx.beginPath();
    v.pts.forEach(([w,a],k)=> k?ctx.lineTo(x(w),y(a)):ctx.moveTo(x(w),y(a)));
    ctx.stroke();
  });
  if(playhead){ const px=x(playhead); ctx.strokeStyle='#e6edf3'; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(px,T); ctx.lineTo(px,H-B); ctx.stroke(); ctx.setLineDash([]); }
  drawReadout();
}
function nearest(v,w){ let best=v.pts[0]; for(const p of v.pts){ if(Math.abs(p[0]-w)<Math.abs(best[0]-w)) best=p; } return best; }
function drawReadout(){
  const w=Math.max(1,Math.round(playhead));
  const parts=[...on].map(i=>`${D[i].name}: ${nearest(D[i],w)[1].toFixed(0)}`);
  document.getElementById('ro').textContent=`第 ${Math.ceil(w/30)} 年 · 第 ${((w-1)%30)+1} 周　`+parts.join(' ｜ ');
}
const sc=document.getElementById('sc');
sc.oninput=()=>{ playhead=+sc.value/1000*240; render(); };
let timer=null;
document.getElementById('play').onclick=()=>{
  if(timer){clearInterval(timer);timer=null;return;}
  const start=(playhead>=240||playhead<1)?0:playhead;
  let w=start;
  timer=setInterval(()=>{ w+=4; if(w>=240){w=240;clearInterval(timer);timer=null;} playhead=w; sc.value=w/240*1000; render(); },60);
};
document.getElementById('reset').onclick=()=>{ playhead=0; sc.value=0; render(); };
render();
</script></body></html>
