": 0.4}, {"thr": 70, "y": 1.2}, {"thr": 80, "y": 1.87}, {"thr": 90, "y": 2.67}, {"thr": 99, "y": 3.6}], "peak": {"w": 160, "y": 5.33, "avg4": 100, "min4": 100}};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,L=48,R=18,T=18,B=36;
const x=w=>L+(w/240)*(W-L-R), y=a=>T+(1-a/105)*(H-T-B);
function line(pts,i,color,dash,width){
  ctx.setLineDash(dash||[]); ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.beginPath();
  pts.forEach((p,k)=> k?ctx.lineTo(x(p[0]),y(p[i])):ctx.moveTo(x(p[0]),y(p[i])));
  ctx.stroke(); ctx.setLineDash([]);
}
function grid(){
  ctx.clearRect(0,0,W,H);
  ctx.font='11px system-ui'; ctx.fillStyle='#8b949e'; ctx.strokeStyle='#262c36'; ctx.lineWidth=1;
  for(let a=0;a<=100;a+=20){ctx.beginPath();ctx.moveTo(L,y(a));ctx.lineTo(W-R,y(a));ctx.stroke();ctx.fillText(a,L-28,y(a)+4);}
  for(let w=0;w<=240;w+=30){ctx.beginPath();ctx.moveTo(x(w),T);ctx.lineTo(x(w),H-B);ctx.stroke();if(w)ctx.fillText((w/30)+'年',x(w)-10,H-16);}
  D.thr.forEach(t=>{
    const yy=y(t.thr);
    ctx.setLineDash([5,5]); ctx.strokeStyle= t.thr>=90?'#3fb950':'#30363d';
    ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(W-R,yy);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle= t.thr>=90?'#3fb950':'#8b949e'; ctx.fillText(t.thr, L+6, yy-5);
  });
}
let playhead=0;
function render(){
  grid();
  line(D.old,1,'#484f58',[4,4],2);
  line(D.new,1,'#58a6ff',[],2.5);
  line(D.new,2,'#3fb950',[2,3],1.2);
  D.thr.forEach(t=>{ if(t.y){ const px=x(t.y*30); ctx.fillStyle='#58a6ff'; ctx.beginPath(); ctx.arc(px,y(t.thr),3.5,0,7); ctx.fill(); }});
  if(playhead){const px=x(playhead);ctx.strokeStyle='#e6edf3';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(px,T);ctx.lineTo(px,H-B);ctx.stroke();ctx.setLineDash([]);}
  readout();
}
function at(pts,w){let b=pts[0];for(const p of pts){if(Math.abs(p[0]-w)<Math.abs(b[0]-w))b=p;}return b;}
function readout(){
  const w=Math.max(1,Math.round(playhead));
  const p=at(D.new,w), o=at(D.old,w);
  document.getElementById('ro').textContent=`第 ${Math.ceil(w/30)} 年 · 第 ${((w-1)%30)+1} 周　40/10 四维均 ${p[1].toFixed(0)}（最低 ${p[2].toFixed(0)}）　40/3 当时 ${o[1].toFixed(0)}`;
}

  tb.insertAdjacentHTML('beforeend',`<tr><td>${t.thr}</td><td class="k">${t.y??'未到'}</td><td>${o.y??'未到'}</td><td>+${d}</td><td>${t.yMin??'未到'}</td></tr>`);
});
const sc=document.getElementById('sc');
sc.oninput=()=>{playhead=+sc.value/1000*240;render();};
let timer=null;
document.getElementById('play').onclick=()=>{
  if(timer){clearInterval(timer);timer=null;return;}
  let w=(playhead>=240||playhead<1)?0:playhead;
  timer=setInterval(()=>{w+=4;if(w>=240){w=240;clearInterval(timer);timer=null;}playhead=w;sc.value=w/240*1000;render();},55);
};
document.getElementById('reset').onclick=()=>{playhead=0;sc.value=0;render();};
render();
